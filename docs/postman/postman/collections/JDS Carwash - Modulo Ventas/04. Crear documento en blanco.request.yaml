$kind: http-request
url: "{{baseUrl}}/documentos/"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
  X-Session-Token: "{{token}}"
body:
  type: text
  content: |-
    {
      "action": "CREAR_DOCUMENTO_POR_USUARIO",
      "key_registro": "{{token}}",
      "_llaveSession": "{{token}}"
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test('Crear documento responde 200', function () {
      pm.response.to.have.status(200); });

      const json = pm.response.json();

      pm.test('Crear documento OK', function () {
      pm.expect(json.ok).to.eql(true); });

      const docId = json?.data?.documentId || json?.data?.documentoFinal?.orden
      || json?.data?.records?.[0]?.orden || '';

      if (docId) { pm.collectionVariables.set('documentoId', String(docId)); }
    language: text/javascript
order: 4000
