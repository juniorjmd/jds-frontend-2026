$kind: http-request
url: "{{baseUrl}}/documentos/"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
  X-Session-Token: "{{token}}"
body:
  type: text
  content: |-
    {
      "action": "CAMBIAR_DOCUMENTO_ACTIVO_POR_USUARIO",
      "_docActual": {{documentoId}},
      "key_registro": "{{token}}",
      "_llaveSession": "{{token}}"
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test('Cambiar documento responde 200', function () {
      pm.response.to.have.status(200); });

      const json = pm.response.json();

      pm.test('Cambio de documento OK', function () {
      pm.expect(json.ok).to.eql(true); });
    language: text/javascript
order: 5000
