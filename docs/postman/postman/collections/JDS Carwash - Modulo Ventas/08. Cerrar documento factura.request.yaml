$kind: http-request
url: "{{baseUrl}}/documentos/"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
  X-Session-Token: "{{token}}"
body:
  type: text
  content: |-
    {
      "action": "CERRAR_DOCUMENTO_FACTURA",
      "_documento": {{documentoId}},
      "key_registro": "{{token}}",
      "_llaveSession": "{{token}}"
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test('Cerrar documento responde 200', function () {
      pm.response.to.have.status(200); });

      const json = pm.response.json();

      pm.test('Cierre OK', function () { pm.expect(json.ok).to.eql(true); });
    language: text/javascript
order: 8000
