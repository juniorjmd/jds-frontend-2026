<a class="menu-card-link" [routerLink]="menuDetalle.direccion">
  <article class="menu-card text-center">
    <div
      class="menu-card__icon"
      [ngStyle]="menuDetalle.img ? { 'background-image': 'url(' + menuDetalle.img + ')' } : null"
    ></div>

    <div class="card-body menu-card__body">
      <h5 class="card-title menu-card__title">
        {{ menuDetalle.display_nombre }}
      </h5>
    </div>
  </article>
</a>
