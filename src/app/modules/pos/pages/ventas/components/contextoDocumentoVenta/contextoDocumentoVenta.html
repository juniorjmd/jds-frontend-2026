<div class="app-panel ventas-card ventas-card--controls">
  <div class="ventas-form-grid">
    <div class="ventas-field ventas-field--client">
      <label class="ventas-field__label">Cliente</label>
      <div class="ventas-client-picker">
        <button type="button" class="btn ventas-client-picker__name" title="Seleccionar cliente" (click)="buscarCliente.emit()">
          <span>{{ documentoActivo?.clienteNombre || 'CLIENTE GENERICO' }}</span>
          <i class="bi bi-person-plus ventas-client-picker__icon" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <div class="ventas-field">
      <label class="ventas-field__label">Vendedor</label>
      <div class="ventas-select-wrap">
        <elemt-empDropdown
          (selectionChange)="cambiarVendedor.emit($event);"
          [selectedValue]="empleadoActivo"
        ></elemt-empDropdown>
      </div>
    </div>

    <div class="ventas-field">
      <label class="ventas-field__label">Documento</label>
      <div class="ventas-select-wrap">
        <elemt-docDropdown
          [options]="documentos"
          (clickBtnRefress)="refrescarDocumentos.emit()"
          (selectionChange)="cambiarDocumentoActivo.emit($event);"
          [selectedValue]="documentoActivo"
        ></elemt-docDropdown>
      </div>
    </div>
  </div>
</div>
