<div class="app-panel ventas-card ventas-card--totals">
                    <div class="ventas-card__head">
                        <div>
                            <h2 class="ventas-card__title">Totales del documento</h2>
                        </div>
                    </div>

                    <div class="app-keyvalue-list ventas-summary-list ventas-summary-list--compact">
                        <div class="app-keyvalue">
                            <span class="app-keyvalue__label">Total</span>
                            <span class="app-keyvalue__value">{{ documentoActivo!.valorTotal || 0 | currency }}</span>
                        </div>
                        <div class="app-keyvalue">
                            <span class="app-keyvalue__label">Ajuste al peso</span>
                            <span class="app-keyvalue__value">{{ documentoActivo!.ajusteAlpeso || 0 | currency }}</span>
                        </div>

                        <div class="app-keyvalue  ">
                            <span class="app-keyvalue__label">Total factura</span>
                            <span class="app-keyvalue__value">{{ documentoActivo!.totalFactura|| 0 | currency }}</span>
                        </div>
                    </div>
                </div>
